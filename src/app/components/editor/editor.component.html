<app-d3container
  (moduleAdded)="hidePreview($event)"
  (editorDataChanged)="updateEditorData($event)"
></app-d3container>
@if (!previewVisible) {
  <button mat-button (click)="showPreview()">
    Generate 3D Model
  </button>
}
@if (previewVisible) {
  <app-preview3d
    [modulesList]="trackerModuleList"
    [editorData]="editorData"
  ></app-preview3d>
}
